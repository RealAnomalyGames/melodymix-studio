
name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MelodyMix Studio for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build application
        run: cmake --build build --config Release --parallel

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/Release/MelodyMixStudio.exe"
          $package = "package/MelodyMixStudio"

          if (!(Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }

          New-Item -ItemType Directory -Force -Path $package |
            Out-Null

          Copy-Item $exe $package/

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir $package `
            $exe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          Copy-Item README.md $package/

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "package/MelodyMixStudio-windows-x64.zip" `
            -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseZip = "package/MelodyMixStudio-windows-x64.zip"
          $exe = "package/MelodyMixStudio/MelodyMixStudio.exe"

          $zipHash = (Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          "$zipHash  MelodyMixStudio-windows-x64.zip" |
            Out-File `
              -FilePath "package/MelodyMixStudio-windows-x64.zip.sha256" `
              -Encoding ascii

          "$exeHash  MelodyMixStudio.exe" |
            Out-File `
              -FilePath "package/MelodyMixStudio/MelodyMixStudio.exe.sha256" `
              -Encoding ascii

          Write-Output "Release ZIP SHA-256: $zipHash"
          Write-Output "Executable SHA-256: $exeHash"

      - name: Verify release ZIP checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "package/MelodyMixStudio-windows-x64.zip"
          $checksumFile = "$file.sha256"

          $expectedLine = Get-Content $checksumFile -Raw
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s+') {
            throw "Checksum file has an invalid format."
          }

          $expected = $Matches[1].ToLower()
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()

          if ($actual -ne $expected) {
            throw "SHA-256 verification failed."
          }

          Write-Output "Release ZIP checksum verified successfully."

      - name: Upload unpacked application for testing
        uses: actions/upload-artifact@v4
        with:
          name: MelodyMixStudio-windows-x64
          path: |
            package/MelodyMixStudio/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/MelodyMixStudio-windows-x64.zip
            package/MelodyMixStudio-windows-x64.zip.sha256
          generate_release_notes: true
