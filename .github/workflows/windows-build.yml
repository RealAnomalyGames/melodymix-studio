name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MelodyMix Studio for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build application
        run: cmake --build build --config Release --parallel

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build/Release/MelodyMixStudio.exe"
          $package = "package/MelodyMixStudio"

          if (!(Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }

          New-Item -ItemType Directory -Force -Path $package |
            Out-Null

          Copy-Item $exe $package

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir $package `
            $exe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          Copy-Item README.md $package/

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "package/MelodyMixStudio-windows-x64.zip" `
            -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "package/MelodyMixStudio-windows-x64.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()

          "$hash  MelodyMixStudio-windows-x64.zip" |
            Out-File `
              -FilePath "package/MelodyMixStudio-windows-x64.zip.sha256" `
              -Encoding ascii

          Write-Output "SHA-256: $hash"

      - name: Upload build and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MelodyMixStudio-windows-x64
          path: |
            package/MelodyMixStudio-windows-x64.zip
            package/MelodyMixStudio-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/MelodyMixStudio-windows-x64.zip
            package/MelodyMixStudio-windows-x64.zip.sha256
          generate_release_notes: true
